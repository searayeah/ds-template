linters_formatters:
  type: str
  help: What linters, formatters  to use?
  multiselect: true
  message: "What pre-commit hooks do you want?"
  choices:
    - pre-commit-hooks
    - check-jsonschema
    - pygrep-hooks
    - gitleaks
    - language-formatters-pre-commit-hooks
    - pre-commit-shfmt
    - shellcheck-py
    - mirrors-prettier
    - markdownlint-cli
    - mdformat
    - yamlfix
    - yamllint
